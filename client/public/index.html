<!doctype html>
<html lang="%LANG_ISO_CODE%">

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BiteDown</title>
    <meta name="theme-color" content="#F4F8E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1A12" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BiteDown" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style id="expo-reset">
      html,

        height: 100%;

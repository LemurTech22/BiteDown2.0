<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: Use by date sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#E8F0DA}
a{color:#B9D871}a:hover{color:#E8F0DA}

body{background:#0F1A12}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: flex-end">
  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="background: #18261B; border-radius: 28px 28px 0 0; padding: 12px 20px 34px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #34483A"></span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h2 id="sheet-title" style="margin: 0; font-family: Outfit, sans-serif; font-size: 22px; font-weight: 600">Use by</h2>
      <span style="font-size: 14px; color: #9DB09F">Baby spinach · estimated Sat, Oct 11</span>
    </div>
    <div role="group" aria-label="Quick picks" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="5">
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #34483A; background: #18261B; color: #B9D871; font-size: 15px; font-weight: 600">{{q}}</button>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #34483A; background: #18261B; color: #B9D871; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <span style="font-family: Outfit, sans-serif; font-size: 17px; font-weight: 600">October 2026</span>
      <button type="button" aria-label="Next month" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #34483A; background: #18261B; color: #B9D871; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center">
      <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
        <span style="font-size: 12px; font-weight: 600; color: #9DB09F; padding-bottom: 4px">{{w}}</span>
      </sc-for>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
        <button type="button" aria-label="{{d.label}}" style="{{d.style}}">{{d.n}}</button>
      </sc-for>
    </div>
    <button type="button" style="height: 52px; border-radius: 16px; border: 1px solid #34483A; background: #18261B; color: #B9D871; font-size: 16px; font-weight: 600">Cancel</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const names = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const base = 'height: 44px; border-radius: 12px; font-size: 15px; font-family: inherit; ';
const days = [];
for (let i = 0; i < 4; i++) days.push({ n: '', label: 'No day', style: base + 'border: 0; background: transparent; visibility: hidden' });
for (let n = 1; n <= 31; n++) {
const wd = names[(n + 3) % 7];
const today = n === 6, picked = n === 11;
let style = base + 'border: 0; background: transparent; color: #E8F0DA';
if (today) style = base + 'border: 2px solid #B9D871; background: transparent; color: #E8F0DA; font-weight: 600';
if (picked) style = base + 'border: 0; background: #B9D871; color: #13261A; font-weight: 700';
days.push({ n: String(n), label: wd + ', October ' + n + (today ? ', today' : '') + (picked ? ', selected' : ''), style });
}
return { quick: ['Today', 'Tomorrow', '+3 days', '+1 week', '+2 weeks'], weekdays: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], days };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shared food</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#13261A}
a{color:#1F4D2B}a:hover{color:#13261A}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F8E8; padding: 56px 20px 34px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 10px">
    <a href="Social.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D3E0BF; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div>
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 26px">Shared food</h1>
      <p style="margin: 2px 0 0; font-size: 14px; color: #45584A">Shared by friends and groups</p>
    </div>
  </header>
  <div role="tablist" aria-label="Source" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E3EDCB; border-radius: 14px">
    <button role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; color: #13261A; font-weight: 600; font-size: 15px">All</button>
    <button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 10px; background: transparent; color: #45584A; font-weight: 500; font-size: 15px">Friends</button>
    <button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 10px; background: transparent; color: #45584A; font-weight: 500; font-size: 15px">Groups</button>
  </div>
  <section aria-labelledby="fp-mine" style="display: flex; flex-direction: column; gap: 8px">
    <h2 id="fp-mine" style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">You're sharing</h2>
    <a href="ItemShared.dc.html" aria-label="Spinach, 1 bag, shared by you" style="min-height: 44px; text-decoration: none; color: #13261A; background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Spinach, 1 bag</span><span style="font-size: 13px; color: #45584A">Not claimed yet</span></span>
      <span style="font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #EEF5D6; color: #1F4D2B; white-space: nowrap">2–3 days</span>
    </a>
  </section>
  <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{listings}}" as="l" hint-placeholder-count="4">
      <li style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
        <span style="{{l.tile}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{l.stroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{l.icon}}"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 16px; font-weight: 600">{{l.name}}</span>
          <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px"><span style="font-size: 13px; color: #45584A">{{l.meta}}</span><span style="{{l.badgeStyle}}">{{l.when}}</span></span>
          <sc-if value="{{l.pickupSet}}" hint-placeholder-val="{{ true }}">
            <span style="display: flex; align-items: center; gap: 4px; margin-top: 2px; font-size: 13px; color: #45584A"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>Pickup spot set</span>
          </sc-if>
        </span>
        <sc-if value="{{l.claimed}}" hint-placeholder-val="{{ false }}">
          <a href="ClaimedItem.dc.html" aria-label="Claimed by you: view pickup" style="min-height: 44px; display: flex; align-items: center; gap: 2px; text-decoration: none; font-size: 13px; font-weight: 600; color: #1F4D2B">Claimed<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
        </sc-if>
        <sc-if value="{{l.open}}" hint-placeholder-val="{{ true }}">
          <button style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #1F4D2B; color: #F4F8E8; font-size: 14px; font-weight: 600">Claim</button>
        </sc-if>
      </li>
    </sc-for>
  </ul>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tile = (bg) => 'width: 40px; height: 40px; border-radius: 12px; background: ' + bg + '; display: flex; align-items: center; justify-content: center; flex-shrink: 0';
const G = 'M5 11a4 4 0 0 1 1-7h12a4 4 0 0 1 1 7v9H5zM9 11v5M15 11v5';
const V = 'M7 17l-3 3M15.5 8.5l-8 8c-1.4-1.4-1.4-3.6 0-5l3-3c1.4-1.4 3.6-1.4 5 0zM15.5 8.5c.8-2.2 2.7-3.5 5-3.5M15.5 8.5c2.2-.8 3.5-2.7 3.5-5';
const P = 'M14.5 3.5a6 6 0 0 1 6 6c0 3.3-2.7 5.4-5.6 5.9l-3.6 3.6a2.2 2.2 0 1 1-3.1-3.1l-.6-.6a2.2 2.2 0 1 1 3.1-3.1l3.6-3.6c.5-2.9 0-5.1.2-5.1z';
const J = 'M8 3h8v3H8zM7 6h10a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM6 11h12';
const soon = 'font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #EEF5D6; color: #1F4D2B; white-space: nowrap';
const urgent = 'font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #FBE3CF; color: #8A3B0E; white-space: nowrap';
return {
listings: [
{ name: 'Sourdough, half loaf', meta: 'Theo Nguyen', when: '2–3 days', badgeStyle: soon, icon: G, stroke: '#8A6414', tile: tile('#F5EBCD'), open: false, claimed: true, pickupSet: true },
{ name: 'Basil', meta: 'Moody Hall 4F', when: 'Tomorrow', badgeStyle: urgent, icon: V, stroke: '#2F7A3A', tile: tile('#E2F1D8'), open: true, claimed: false, pickupSet: true },
{ name: 'Eggs, 6', meta: 'Jordan K.', when: '2–3 weeks', badgeStyle: soon, icon: P, stroke: '#B0412E', tile: tile('#FBE4DE'), open: true, claimed: false, pickupSet: false },
{ name: 'Jasmine rice, 2 lb', meta: 'CougarCS Kitchen', when: '3+ weeks', badgeStyle: soon, icon: J, stroke: '#6A4FA3', tile: tile('#ECE5F7'), open: true, claimed: false, pickupSet: true }]
};
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: Review photo results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#E8F0DA}
a{color:#B9D871}a:hover{color:#E8F0DA}

body{background:#0F1A12}</style>
</helmet>
<div style="width: 390px; height: 1050px; box-sizing: border-box; background: #0F1A12; display: flex; flex-direction: column">
  <main style="flex: 1; overflow: hidden; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; align-items: center; gap: 10px">
      <a href="AddSheet.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #18261B; box-shadow: inset 0 0 0 1px #34483A; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9D871" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 24px">We found 7 items</h1>
    </header>
    <p style="margin: 0; font-size: 14px; color: #9DB09F">Everything is filled in. Check the flagged ones, then add.</p>

    <section aria-labelledby="spoiled-heading" style="display: flex; flex-direction: column; gap: 6px">
      <h2 id="spoiled-heading" style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #FFB98A">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17.5v.01"></path></svg>
        Looks spoiled</h2>
      <ul style="list-style: none; margin: 0; padding: 0; background: #18261B; border-radius: 16px">
        <sc-for list="{{spoiled}}" as="s" hint-placeholder-count="1">
          <li style="display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px">
            <span role="img" aria-label="{{s.photoLabel}}" style="width: 44px; height: 44px; border-radius: 12px; background: #3A1C2B; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; color: #F59AC6">photo</span>
            <span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
            <button type="button" aria-label="{{s.tossLabel}}" style="height: 44px; padding: 0 12px; border-radius: 12px; background: #18261B; border: 1px solid #34483A; color: #FFB98A; font-size: 15px; font-weight: 600; flex-shrink: 0">Toss it</button>
            <button type="button" aria-label="{{s.keepLabel}}" style="height: 44px; padding: 0 12px; border-radius: 12px; background: #18261B; border: 1px solid #34483A; color: #B9D871; font-size: 15px; font-weight: 600; flex-shrink: 0">Keep it</button>
          </li>
        </sc-for>
      </ul>
    </section>

    <ul style="list-style: none; margin: 0; padding: 0; background: #18261B; border-radius: 16px; overflow: hidden">
      <sc-for list="{{found}}" as="f" hint-placeholder-count="6">
        <li style="display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; border-bottom: 1px solid #2A3A2D">
          <button type="button" role="checkbox" aria-checked="{{f.checked}}" aria-label="{{f.pickLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <span style="{{f.boxStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#13261A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{f.tickStyle}}"><path d="M5 12l5 5L20 7"></path></svg></span></button>
          <button type="button" aria-label="{{f.editLabel}}" style="flex: 1; min-width: 0; min-height: 56px; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 0; text-align: left; font-family: inherit; color: #E8F0DA">
            <span role="img" aria-label="{{f.photoLabel}}" style="{{f.thumbStyle}}">{{f.thumbText}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span><span style="{{f.checkStyle}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.01"></path></svg>Check this</span></span>
              <span style="font-size: 13px; color: #9DB09F">{{f.meta}}</span>
            </span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9DB09F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
      </sc-for>
    </ul>

    <a href="AddText.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 600">+ Add something we missed</a>
  </main>

  <footer style="padding: 12px 20px 34px; background: #0F1A12; border-top: 1px solid #2A3A2D; display: flex; flex-direction: column; gap: 8px">
    <p style="margin: 0; font-size: 13px; color: #9DB09F; text-align: center">Decide on spoiled items to continue</p>
    <a href="Fridge.dc.html" aria-disabled="true" style="opacity: .45; text-decoration: none; height: 56px; border-radius: 16px; background: #B9D871; color: #13261A; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">Add 6 items</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1050}}'>
class Component extends DCLogic {
renderVals() {
const box = (on) => 'width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #B9D871; border: 2px solid #B9D871' : 'background: transparent; border: 2px solid #9DB09F');
const thumb = (tint) => 'width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; ' + tint;
const check = 'display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #3A3112; color: #FFD970; white-space: nowrap';
const f = (name, meta, tint, o) => {
const x = o || {};
return { name, meta, checked: 'true', boxStyle: box(true), tickStyle: 'display: block', pickLabel: 'Add ' + name,
editLabel: 'Edit ' + name + ', ' + meta + (x.check ? ', Check this' : ''), photoLabel: 'Photo of ' + name,
thumbStyle: thumb(tint), thumbText: 'photo', checkStyle: x.check ? check : 'display: none' };
};
return {
spoiled: [{ name: 'Strawberries', photoLabel: 'Photo of strawberries', tossLabel: 'Toss Strawberries', keepLabel: 'Keep Strawberries' }],
found: [
f('Cheddar', 'Fridge · not sure of the date', 'background: #3A3720; color: #FFD970', { check: true }),
f('Baby spinach', 'Fridge · use in 4–5 days', 'background: #1C3320; color: #8FD69A'),
f('Greek yogurt', 'Fridge · use in 1–2 weeks', 'background: #1C2540; color: #9DB7F0'),
f('Chicken thighs', 'Fridge · use in 2–3 days', 'background: #3D1F1A; color: #FF9E8A'),
f('Bananas', 'Pantry · use soon', 'background: #33290F; color: #E8C46A'),
f('Eggs', 'Fridge · use in 3+ weeks', 'background: #33290F; color: #E8C46A')
]
};
}
}
</script>
</body>
</html>
